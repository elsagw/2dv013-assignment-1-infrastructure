---
# Ping test
- name: A ping to all
  hosts: all
  tasks:
    - name: Ping
      ping:
        data: "Assignment 1 - server received the ping"
      register: data_struct

    - name: Print return of ping
      debug:
        msg: "{{ data_struct.ping }}"

# Configure webservers with Apache
- name: Install and configure Apache webservers
  hosts: webservers
  become: yes
  tasks:
    - name: Install latest version of Apache2
      apt: 
        name: apache2 
        update_cache: yes 
        state: latest

    - name: Save the default index.html
      copy: 
        remote_src: True 
        src: /var/www/html/index.html 
        dest: /var/www/html/index.html.default 
        force: false

    - name: Copy your custom index.html
      copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Customize output for the server that delivers it
      ansible.builtin.shell: echo "Content proudly delivered by $(hostname)" >> /var/www/html/index.html

    - name: Ensure Apache listens on port 80
      ansible.builtin.lineinfile:
        path: /etc/apache2/ports.conf
        regexp: '^Listen '
        line: 'Listen 80'
      notify: restart-apache

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: restart-apache
      service:
        name: apache2
        state: restarted

# Load balancer configuration
- name: Install and configure Nginx load balancer
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: latest
        update_cache: yes

    - name: Create nginx load balancer configuration
      template:
        src: templates/nginx-loadbalancer.conf.j2
        dest: /etc/nginx/sites-available/loadbalancer
      notify: restart-nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart-nginx

    - name: Enable load balancer configuration
      file:
        src: /etc/nginx/sites-available/loadbalancer
        dest: /etc/nginx/sites-enabled/loadbalancer
        state: link
      notify: restart-nginx

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: restart-nginx
      service:
        name: nginx
        state: restarted
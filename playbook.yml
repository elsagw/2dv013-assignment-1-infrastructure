---
# Ping test for all servers
- name: Test connectivity to all servers
  hosts: all
  tasks:
    - name: Ping all servers
      ping:
        data: "Assignment 1 connectivity test"
      register: ping_result
    - name: Show ping results
      debug:
        msg: "{{ inventory_hostname }}: {{ ping_result.ping }}"

# Configure webservers with Apache
- name: Install and configure Apache webservers
  hosts: webservers
  become: yes
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install Apache2
      apt:
        name: apache2
        state: latest

    - name: Copy index.html to webservers
      copy:
        src: ./index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Customize index.html with hostname
      ansible.builtin.shell: |
        echo "<h1>Webserver: $(hostname)</h1>" > /var/www/html/hostname.html
        echo "<p>Content delivered by $(hostname)</p>" >> /var/www/html/hostname.html
        cat /var/www/html/hostname.html >> /var/www/html/index.html

    - name: Configure Apache to listen on port 80
      ansible.builtin.lineinfile:
        path: /etc/apache2/ports.conf
        regexp: '^Listen '
        line: 'Listen {{ webserver_port }}'
      notify: restart-apache

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: restart-apache
      service:
        name: apache2
        state: restarted

# Configure load balancer with Nginx
- name: Install and configure Nginx load balancer
  hosts: loadbalancer
  become: yes
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: latest

    - name: Create nginx load balancer configuration
      template:
        src: nginx-loadbalancer.conf.j2
        dest: /etc/nginx/sites-available/loadbalancer
      notify: restart-nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart-nginx

    - name: Enable load balancer configuration
      file:
        src: /etc/nginx/sites-available/loadbalancer
        dest: /etc/nginx/sites-enabled/loadbalancer
        state: link
      notify: restart-nginx

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: restart-nginx
      service:
        name: nginx
        state: restarted